<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kummari Connect | MERN Stack Web App</title>
  <!-- React, ReactDOM, Babel for browser execution -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy-dark: #0B2545;
      --navy-medium: #134074;
      --coral-primary: #FF6B4A;
      --coral-hover: #E55333;
      --gold-accent: #F59E0B;
      --bg-slate: #F8FAFC;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
    body { background: var(--bg-slate); color: #0F172A; }
    h1, h2, h3, h4 { font-family: 'Outfit', sans-serif; }
    .container { max-width: 1240px; margin: 0 auto; padding: 0 1.5rem; }
    .btn-primary { background: linear-gradient(135deg, #FF6B4A, #E55333); color: white; padding: 0.75rem 1.5rem; border-radius: 9999px; font-weight: 600; border: none; cursor: pointer; display: inline-flex; align-items: center; gap: 0.5rem; }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(255,107,74,0.4); }
    .badge { padding: 0.3rem 0.8rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; }
    .badge-coral { background: rgba(255,107,74,0.15); color: #FF6B4A; }
    .badge-gold { background: #FEF3C7; color: #B45309; }
    .navbar { position: sticky; top: 0; z-index: 100; background: rgba(11, 37, 69, 0.95); backdrop-filter: blur(12px); padding: 1rem 0; color: white; }
    .nav-inner { display: flex; justify-content: space-between; align-items: center; }
    .logo { font-size: 1.4rem; font-weight: 800; font-family: 'Outfit'; color: white; cursor: pointer; }
    .nav-links { display: flex; gap: 1.8rem; list-style: none; }
    .nav-item { cursor: pointer; font-weight: 500; color: #CBD5E1; padding: 0.3rem 0; }
    .nav-item.active { color: white; border-bottom: 2px solid #FF6B4A; }
    .hero { min-height: 75vh; background: linear-gradient(180deg, rgba(11, 37, 69, 0.8) 0%, rgba(11, 37, 69, 0.92) 100%), url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&q=80&w=1600') center/cover; color: white; display: flex; align-items: center; padding: 4rem 0; }
    .search-widget { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(16px); padding: 1.2rem; border-radius: 20px; display: grid; grid-template-columns: 1.5fr 1fr 1fr auto; gap: 1rem; color: #0F172A; margin-top: 2rem; }
    .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 2rem; margin-top: 2rem; }
    .card { background: white; border-radius: 16px; border: 1px solid #E2E8F0; overflow: hidden; display: flex; flex-direction: column; }
    .card-img-wrap { height: 200px; overflow: hidden; position: relative; }
    .card-img { width: 100%; height: 100%; object-fit: cover; }
    .card-body { padding: 1.5rem; display: flex; flex-direction: column; flex: 1; }
    .footer { background: #0B2545; color: #CBD5E1; padding: 3rem 0 1.5rem; margin-top: 4rem; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    const MOCK_DESTINATIONS = [
      {
        id: 'vivekananda-rock',
        title: 'Vivekananda Rock Memorial',
        category: 'Heritage',
        location: 'Vavathurai, Kanyakumari',
        rating: 4.9,
        price: '₹50 / Entry + Ferry',
        image: 'https://images.unsplash.com/photo-1590050752117-238cb0fb12b1?auto=format&fit=crop&q=80&w=1000',
        badge: 'Must Visit',
        description: 'Built in 1970 in honor of Swami Vivekananda who sat in meditation on this rock for three days.'
      },
      {
        id: 'thiruvalluvar-statue',
        title: 'Thiruvalluvar Statue',
        category: 'Heritage',
        location: 'Vavathurai Rock Isle',
        rating: 4.8,
        price: 'Included in Ferry Ticket',
        image: 'https://images.unsplash.com/photo-1627894483216-2138af692e32?auto=format&fit=crop&q=80&w=1000',
        badge: 'Iconic Landmark',
        description: 'A colossal 133-feet high stone sculpture of the immortal Tamil poet Thiruvalluvar.'
      },
      {
        id: 'sunset-point',
        title: 'Kanyakumari Sunset Point',
        category: 'Beaches',
        location: 'Southern Tip Promenade',
        rating: 4.9,
        price: 'Free Entry',
        image: 'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&q=80&w=1000',
        badge: 'Natural Wonder',
        description: 'The unique geographical convergence where you can witness three ocean horizons.'
      }
    ];

    function App() {
      const [activeTab, setActiveTab] = useState('explore');
      const [cartCount, setCartCount] = useState(1);

      return (
        <div>
          <nav className="navbar">
            <div className="container nav-inner">
              <div className="logo" onClick={() => setActiveTab('explore')}>
                🌅 KUMMARI CONNECT
              </div>
              <ul className="nav-links">
                <li className={`nav-item ${activeTab==='explore'?'active':''}`} onClick={()=>setActiveTab('explore')}>Explore</li>
                <li className={`nav-item ${activeTab==='itinerary'?'active':''}`} onClick={()=>setActiveTab('itinerary')}>AI Itinerary</li>
                <li className={`nav-item ${activeTab==='guides'?'active':''}`} onClick={()=>setActiveTab('guides')}>Local Guides</li>
                <li className={`nav-item ${activeTab==='market'?'active':''}`} onClick={()=>setActiveTab('market')}>Artisan Market</li>
                <li className={`nav-item ${activeTab==='admin'?'active':''}`} onClick={()=>setActiveTab('admin')}>Admin Portal</li>
              </ul>
              <button className="btn-primary" onClick={()=>alert('Express JWT Authentication system ready!')}>
                Sign In
              </button>
            </div>
          </nav>

          {activeTab === 'explore' && (
            <div>
              <section className="hero">
                <div className="container">
                  <span className="badge badge-gold">MERN STACK PLATFORM</span>
                  <h1 style={{ fontSize: '3.2rem', marginTop: '1rem', fontWeight: '800' }}>Where Three Seas Meet Harmony</h1>
                  <p style={{ fontSize: '1.2rem', color: '#CBD5E1', maxWidth: '650px', marginTop: '0.8rem' }}>
                    Full MERN stack platform for Kanyakumari tourism, certified local guides, and Kanikkar tribal artisan marketplace.
                  </p>

                  <div className="search-widget">
                    <div>
                      <label style={{ fontSize: '0.75rem', fontWeight: '700', color: '#64748B' }}>DESTINATION</label>
                      <input type="text" placeholder="Search Vivekananda Rock..." style={{ border: 'none', outline: 'none', width: '100%', fontSize: '0.95rem' }} />
                    </div>
                    <div>
                      <label style={{ fontSize: '0.75rem', fontWeight: '700', color: '#64748B' }}>DATE</label>
                      <input type="date" defaultValue="2026-07-30" style={{ border: 'none', outline: 'none', width: '100%', fontSize: '0.95rem' }} />
                    </div>
                    <div>
                      <label style={{ fontSize: '0.75rem', fontWeight: '700', color: '#64748B' }}>TRAVELERS</label>
                      <select style={{ border: 'none', outline: 'none', width: '100%', fontSize: '0.95rem' }}>
                        <option>2 Guests</option>
                      </select>
                    </div>
                    <button className="btn-primary">Search</button>
                  </div>
                </div>
              </section>

              <section className="container" style={{ padding: '4rem 0' }}>
                <h2 style={{ fontSize: '2rem', color: '#0B2545' }}>Top Attractions</h2>
                <div className="cards-grid">
                  {MOCK_DESTINATIONS.map(d => (
                    <div key={d.id} className="card">
                      <div className="card-img-wrap">
                        <img src={d.image} className="card-img" />
                      </div>
                      <div className="card-body">
                        <span className="badge badge-coral" style={{ width: 'fit-content', marginBottom: '0.5rem' }}>{d.badge}</span>
                        <h3 style={{ color: '#0B2545', fontSize: '1.25rem' }}>{d.title}</h3>
                        <p style={{ color: '#64748B', fontSize: '0.9rem', margin: '0.6rem 0' }}>{d.description}</p>
                        <div style={{ marginTop: 'auto', display: 'flex', justifyContent: 'space-between', alignItems: 'center', paddingTop: '1rem', borderTop: '1px solid #E2E8F0' }}>
                          <strong style={{ color: '#0B2545' }}>{d.price}</strong>
                          <button className="btn-primary" style={{ padding: '0.5rem 1rem', fontSize: '0.85rem' }} onClick={()=>alert(`Booking details for ${d.title}`)}>Book Pass</button>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              </section>
            </div>
          )}

          {activeTab === 'itinerary' && (
            <div className="container" style={{ padding: '4rem 0' }}>
              <h2 style={{ fontSize: '2rem', color: '#0B2545' }}>AI 3-Day Coastal Itinerary</h2>
              <p style={{ color: '#64748B' }}>Optimized route based on live ferry queue times and ocean tides.</p>
              <div style={{ background: 'white', padding: '2rem', borderRadius: '16px', marginTop: '2rem', border: '1px solid #E2E8F0' }}>
                <h3 style={{ color: '#FF6B4A' }}>Day 1: Ocean Confluence & Sunrise Magic</h3>
                <ul style={{ marginTop: '1rem', lineHeight: '2' }}>
                  <li>🌅 <strong>05:30 AM:</strong> Sunrise View at Southern Tip</li>
                  <li>🚢 <strong>08:00 AM:</strong> Ferry Ride to Vivekananda Rock & Statue</li>
                  <li>🍛 <strong>01:00 PM:</strong> Authentic Banana Leaf Meal</li>
                </ul>
              </div>
            </div>
          )}

          {activeTab === 'guides' && (
            <div className="container" style={{ padding: '4rem 0' }}>
              <h2 style={{ fontSize: '2rem', color: '#0B2545' }}>Certified Local Guides</h2>
              <p style={{ color: '#64748B' }}>Fluent in Tamil, English, and Malayalam.</p>
              <div className="cards-grid">
                <div className="card" style={{ padding: '1.5rem' }}>
                  <h3>Ramesh Kumar</h3>
                  <p style={{ color: '#FF6B4A', fontWeight: '700' }}>₹800 / Day</p>
                  <p style={{ fontSize: '0.9rem', color: '#64748B', margin: '0.5rem 0' }}>Government certified guide with 8 years experience in maritime history.</p>
                  <button className="btn-primary" style={{ marginTop: '1rem' }} onClick={()=>alert('Booking guide Ramesh Kumar...')}>Book Guide</button>
                </div>
              </div>
            </div>
          )}

          {activeTab === 'market' && (
            <div className="container" style={{ padding: '4rem 0' }}>
              <h2 style={{ fontSize: '2rem', color: '#0B2545' }}>Kanikkar Tribal Artisan Shop</h2>
              <p style={{ color: '#64748B' }}>100% direct proceeds support local tribal artisans.</p>
              <div className="cards-grid">
                <div className="card" style={{ padding: '1.5rem' }}>
                  <h3>Banana Fiber Eco Handbag</h3>
                  <p style={{ color: '#FF6B4A', fontWeight: '700' }}>₹499</p>
                  <button className="btn-primary" style={{ marginTop: '1rem' }} onClick={()=>alert('Added item to cart!')}>Add to Cart</button>
                </div>
              </div>
            </div>
          )}

          {activeTab === 'admin' && (
            <div className="container" style={{ padding: '4rem 0' }}>
              <h2 style={{ fontSize: '2rem', color: '#0B2545' }}>Admin Portal</h2>
              <p style={{ color: '#64748B' }}>Express REST API & MongoDB Operational Overview.</p>
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: '1.5rem', marginTop: '2rem' }}>
                <div style={{ background: 'white', padding: '1.5rem', borderRadius: '14px', border: '1px solid #E2E8F0' }}>
                  <div>Total Visitors Today</div>
                  <h3 style={{ fontSize: '1.8rem', color: '#0B2545' }}>8,420</h3>
                </div>
                <div style={{ background: 'white', padding: '1.5rem', borderRadius: '14px', border: '1px solid #E2E8F0' }}>
                  <div>Ferry Passes Issued</div>
                  <h3 style={{ fontSize: '1.8rem', color: '#FF6B4A' }}>4,190</h3>
                </div>
                <div style={{ background: 'white', padding: '1.5rem', borderRadius: '14px', border: '1px solid #E2E8F0' }}>
                  <div>Express API Status</div>
                  <h3 style={{ fontSize: '1.8rem', color: '#10B981' }}>Connected</h3>
                </div>
              </div>
            </div>
          )}

          <footer className="footer">
            <div className="container" style={{ textAlign: 'center' }}>
              <p>© 2026 Kummari Connect. Built with MongoDB, Express, React, Node.js.</p>
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
